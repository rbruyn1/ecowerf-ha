configuration:
  username:
    name: Username
    description: Your login for mijnecowerf.be
  password:
    name: Password
    description: Your password for mijnecowerf.be
  update_interval_days:
    name: Interval (days)
    description: How often the app logs in and fetches data (1 to 31 days, default 1)
  log_level:
    name: Log level
    description: debug, info, warning or error (default info)
  dump_pages:
    name: Dump pages to log
    description: After the first login, write the transactions (JSON) and the Ophaalkalender and Statistieken pages to the log (on by default; turn off after use)
  mqtt_host:
    name: MQTT host
    description: Leave empty when using the Mosquitto app (automatic via the Supervisor)
  mqtt_port:
    name: MQTT port
    description: Broker port (default 1883, manual broker only)
  mqtt_username:
    name: MQTT username
    description: Manual broker only
  mqtt_password:
    name: MQTT password
    description: Manual broker only
