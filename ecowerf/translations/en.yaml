configuration:
  username:
    name: Username
    description: Your login for mijnecowerf.be
  password:
    name: Password
    description: Your password for mijnecowerf.be
  update_interval_minutes:
    name: Interval (minutes)
    description: How often the app logs in and fetches data (15 to 1440, default 360)
  log_level:
    name: Log level
    description: debug, info, warning or error (default info)
  dump_pages:
    name: Dump pages to log
    description: After the first login, write the transactions (JSON) and the Ophaalkalender and Statistieken pages to the log (on by default; turn off after use)
