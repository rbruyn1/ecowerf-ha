configuration:
  username:
    name: Gebruikersnaam
    description: Je login op mijnecowerf.be
  password:
    name: Wachtwoord
    description: Je wachtwoord op mijnecowerf.be
  update_interval_days:
    name: Interval (dagen)
    description: Hoe vaak de app inlogt en gegevens ophaalt (1 tot 31 dagen, standaard 1)
  log_level:
    name: Logniveau
    description: debug, info, warning of error (standaard info)
  dump_pages:
    name: Pagina's loggen
    description: Zet na de eerste login de verrichtingen (JSON) en de pagina's Ophaalkalender en Statistieken in het log (standaard aan; zet uit na gebruik)
  mqtt_host:
    name: MQTT-host
    description: Leeg laten als je de Mosquitto-app gebruikt (automatisch via de Supervisor)
  mqtt_port:
    name: MQTT-poort
    description: Poort van de broker (standaard 1883, enkel bij handmatige broker)
  mqtt_username:
    name: MQTT-gebruikersnaam
    description: Enkel bij een handmatig ingevulde broker
  mqtt_password:
    name: MQTT-wachtwoord
    description: Enkel bij een handmatig ingevulde broker
