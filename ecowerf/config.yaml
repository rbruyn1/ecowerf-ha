name: Ecowerf
version: "0.3.1"
slug: ecowerf
description: Zet ophaaldata, saldo en tarieven van mijnecowerf.be als sensoren in Home Assistant (via MQTT)
url: https://github.com/rbruyn1/ecowerf-ha
arch:
  - aarch64
  - amd64
startup: application
boot: auto
services:
  - mqtt:want
init: false
options:
  username: ""
  password: ""
  update_interval_days: 1
  log_level: info
  dump_pages: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  username: str
  password: password
  update_interval_days: int(1,31)
  log_level: list(debug|info|warning|error)
  dump_pages: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
